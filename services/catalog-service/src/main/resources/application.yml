spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://localhost:15433/catalog
    username: kippu
    password: kippu_dev
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it,
      # so the schema can never silently drift from what the code expects.
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
